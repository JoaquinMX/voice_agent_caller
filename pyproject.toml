[project]
name = "voice-agent-caller"
version = "0.1.0"
description = "Modular voice agent platform for outbound calling in Mexico"
authors = [{ name = "Voice Agent Team" }]
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "ruff==0.4.3",
    "pytest==8.2.1"
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
